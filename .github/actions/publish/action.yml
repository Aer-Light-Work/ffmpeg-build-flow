name: Publish to rolling release
description: 把本 job 产出的压缩包上传到滚动 release（latest），同名资产覆盖。

runs:
  using: composite
  steps:
    - name: Upload artifacts（${{ runner.os }}）
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -uo pipefail
        # 与各构建步骤同一约定：路径不从 YAML env 传，直接取导出的 RUNNER_TEMP
        OUT="${OUT:-$RUNNER_TEMP/out}"

        # gh 是 Windows 可执行文件，喂给它的路径需要先转成 Win32 形式
        topath() {
          if command -v cygpath >/dev/null 2>&1; then cygpath -w "$1"; else printf '%s' "$1"; fi
        }

        shopt -s nullglob
        raw=()
        for f in "$OUT"/ffmpeg-*.zip "$OUT"/ffmpeg-*.tar.xz; do raw+=("$f"); done
        if [ ${#raw[@]} -eq 0 ]; then
          echo "::$error::$OUT 下没有任何压缩包"
          ls -la "$OUT" 2>&1 || true
          exit 1
        fi
        files=()
        for f in "${raw[@]}"; do files+=("$(topath "$f")"); done
        printf '待上传：%s\n' "${raw[@]##*/}"

        notes="$(topath "$RUNNER_TEMP/rolling-release-notes.md")"
        printf '%s\n' \
          '由 `build-ffmpeg.yml` 自动维护的滚动发布：每次成功构建按固定文件名覆盖同名资产。' \
          '' \
          '消费侧使用不带版本号的直链，例如' \
          '`https://github.com/Aer-Light-Work/ffmpeg-build-flow/releases/download/latest/ffmpeg-win64-lgpl-shared.zip`。' \
          '' \
          '包内布局统一为：单一顶层目录 `ffmpeg-<ref>-<platform>-<variant>[-shared]/`，' \
          '其下有 `bin/`（可执行文件与全部运行时库）、`LICENSE.txt`、`README-build.txt`。' \
          '具体 ref / commit / configure 参数见 `README-build.txt` 与 `ffmpeg -version` 输出。' \
          > "$RUNNER_TEMP/rolling-release-notes.md"

        gh release view "$RELEASE_TAG" --repo "$FFMPEG_REPO" >/dev/null 2>&1 || \
          gh release create "$RELEASE_TAG" --repo "$FFMPEG_REPO" --target "$GITHUB_SHA" \
            --prerelease --title "FFmpeg 滚动构建（latest）" --notes-file "$notes"

        gh release upload "$RELEASE_TAG" "${files[@]}" \
          --repo "$FFMPEG_REPO" --clobber
        echo "已更新 https://github.com/$FFMPEG_REPO/releases/tag/$RELEASE_TAG"
